<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Projects — Jiarui Yao</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@200;300;400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
	<style>
		/* ════════════════════════════════════════
   TOKENS
   ════════════════════════════════════════ */
		:root {
			--cream: #f2ebe0;
			--stage: #f4f2ee;
			--blush: #e8a8b0;
			--peach: #f2c89a;
			--wing: #b8cce0;
			--lilac: #d8c0d8;
			--ink: #2a1f1a;
			--ink2: #5a4840;
			--muted: #a08880;
			--card: #fdf9f4;
			--border: rgba(200, 176, 168, .15);
			--nav-h: 52px;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			height: 100%;
		}

		body {
			font-family: 'DM Sans', sans-serif;
			font-weight: 300;
			background: var(--card);
			color: var(--ink);
			overflow: hidden;
			height: 100vh;
			cursor: none;
		}

		a:focus-visible,
		button:focus-visible {
			outline: 2px solid #984653;
			outline-offset: 4px;
		}

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		/* grain */
		body::after {
			content: '';
			position: fixed;
			inset: 0;
			z-index: 9997;
			pointer-events: none;
			opacity: .03;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
			background-size: 220px 220px;
		}

		/* ── CURSOR ── */
		#cur {
			width: 6px;
			height: 6px;
			background: var(--blush);
			border-radius: 50%;
			position: fixed;
			top: 0;
			left: 0;
			pointer-events: none;
			z-index: 9999;
			transform: translate(-50%, -50%);
			mix-blend-mode: multiply;
			transition: transform .12s;
		}

		/* ── PEARL SPHERE ── */
		.sphere {
			position: fixed;
			width: 64px;
			height: 64px;
			border-radius: 50%;
			pointer-events: none;
			z-index: 2;
			transform: translate(-50%, -50%) scale(1.2);
			opacity: 0;
			background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, .95) 0%, rgba(242, 235, 224, .60) 22%, rgba(242, 200, 154, .55) 55%, rgba(42, 31, 26, 1) 100%);
			box-shadow: inset -4px -4px 12px rgba(0, 0, 0, .22), inset 3px 3px 8px rgba(255, 255, 255, .55), 0 12px 30px rgba(42, 31, 26, .14), 0 4px 10px rgba(232, 168, 176, .16);
			filter: blur(4px);
			transition: opacity .4s, transform .5s cubic-bezier(.23, 1, .32, 1), filter .5s cubic-bezier(.23, 1, .32, 1);
		}

		.sphere::before {
			content: '';
			position: absolute;
			inset: 0;
			border-radius: 50%;
			background: conic-gradient(from 180deg, transparent 0deg, rgba(184, 204, 224, .35) 50deg, rgba(216, 192, 216, .30) 110deg, rgba(242, 200, 154, .22) 170deg, rgba(232, 168, 176, .28) 230deg, transparent 280deg, rgba(184, 204, 224, .18) 330deg, transparent 360deg);
			mix-blend-mode: screen;
		}

		.sphere::after {
			content: '';
			position: absolute;
			top: 18%;
			left: 22%;
			width: 26%;
			height: 16%;
			background: radial-gradient(ellipse, rgba(255, 255, 255, .98) 0%, transparent 100%);
			border-radius: 50%;
			transform: rotate(-28deg);
		}

		/* ════════════════════════════════════════
   TOP NAV
   ════════════════════════════════════════ */
		.top-nav {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 100;
			height: var(--nav-h);
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 2rem;
			background: rgba(253, 249, 244, .95);
			backdrop-filter: blur(24px) saturate(150%);
			border-bottom: 1px solid var(--border);
		}

		.nav-logo {
			font-family: 'Cormorant', serif;
			font-size: 1.05rem;
			font-weight: 700;
			letter-spacing: .06em;
			color: var(--ink);
			text-decoration: none;
		}

		.nav-logo em {
			font-style: italic;
			font-weight: 300;
			color: var(--blush);
		}

		.nav-home {
			font-family: 'Space Mono', monospace;
			font-size: .46rem;
			letter-spacing: .18em;
			text-transform: uppercase;
			color: var(--muted);
			text-decoration: none;
			display: flex;
			align-items: center;
			gap: .4rem;
			transition: color .2s, gap .2s;
		}

		.nav-home svg {
			width: 11px;
			height: 11px;
			stroke: currentColor;
			fill: none;
			stroke-width: 1.5;
		}

		.nav-home:hover {
			color: var(--ink);
			gap: .2rem;
		}

		/* ════════════════════════════════════════
   SHELL — 320px + 1fr
   Fixed outer, only right panel scrolls
   ════════════════════════════════════════ */
		.projects-wrap {
			display: grid;
			grid-template-columns: 320px 1fr;
			height: calc(100vh - var(--nav-h));
			margin-top: var(--nav-h);
			overflow: hidden;
		}

		/* ════════════════════════════════════════
   LEFT SIDEBAR — fixed, no scroll
   ════════════════════════════════════════ */
		.lab-sidebar {
			background: var(--card);
			border-right: 1px solid var(--border);
			display: flex;
			flex-direction: column;
			overflow: hidden;
			position: relative;
		}

		/* Category tabs */
		.cat-strip {
			display: flex;
			border-bottom: 1px solid var(--border);
			flex-shrink: 0;
		}

		.ctab {
			flex: 1;
			font-family: 'Space Mono', monospace;
			font-size: .4rem;
			letter-spacing: .16em;
			text-transform: uppercase;
			color: var(--muted);
			background: none;
			border: none;
			border-right: 1px solid var(--border);
			padding: .65rem .5rem;
			cursor: pointer;
			position: relative;
			transition: color .2s, background .2s;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: .3rem;
		}

		.ctab:last-child {
			border-right: none;
		}

		.cdot {
			width: 4px;
			height: 4px;
			border-radius: 50%;
			flex-shrink: 0;
			transition: transform .2s;
		}

		.ctab.s1 .cdot {
			background: var(--wing);
		}

		.ctab.s2 .cdot {
			background: var(--peach);
		}

		.ctab.s3 .cdot {
			background: var(--blush);
		}

		.ctab::after {
			content: '';
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			height: 1.5px;
			transform: scaleX(0);
			transform-origin: left;
			transition: transform .28s cubic-bezier(.22, 1, .36, 1);
		}

		.ctab.s1::after {
			background: var(--wing);
		}

		.ctab.s2::after {
			background: var(--peach);
		}

		.ctab.s3::after {
			background: var(--blush);
		}

		.ctab:hover {
			color: var(--ink2);
			background: rgba(255, 255, 255, .4);
		}

		.ctab.active {
			color: var(--ink);
		}

		.ctab.active .cdot {
			transform: scale(1.6);
		}

		.ctab.active::after {
			transform: scaleX(1);
		}

		/* Lab meta — scrolled watermark number + count */
		.lab-meta {
			padding: 1.6rem 2rem 0;
			display: flex;
			align-items: baseline;
			gap: .6rem;
			flex-shrink: 0;
		}

		.lab-big-num {
			font-family: 'Cormorant', serif;
			font-size: 5rem;
			font-weight: 700;
			line-height: 1;
			letter-spacing: -.05em;
			color: rgba(200, 176, 168, .12);
			user-select: none;
		}

		.lab-counter {
			font-family: 'Space Mono', monospace;
			font-size: .44rem;
			letter-spacing: .16em;
			text-transform: uppercase;
			color: var(--muted);
			padding-bottom: .4rem;
		}

		/* ── SYNC PANEL — the part that updates on scroll ── */
		.sync-panel {
			flex: 1;
			padding: 0 2rem 2rem;
			display: flex;
			flex-direction: column;
			gap: 1rem;
			overflow: hidden;
			transition: opacity .28s ease, transform .28s cubic-bezier(.22, 1, .36, 1);
		}

		.sync-panel.fading {
			opacity: 0;
			transform: translateY(6px);
		}

		.sp-num {
			font-family: 'Cormorant', serif;
			font-size: 1rem;
			font-weight: 700;
			color: rgba(200, 176, 168, .35);
			line-height: 1;
		}

		.sp-label {
			font-family: 'Space Mono', monospace;
			font-size: .42rem;
			letter-spacing: .18em;
			text-transform: uppercase;
			color: var(--blush);
			display: flex;
			align-items: center;
			gap: .4rem;
		}

		.sp-label::before {
			content: '';
			width: 10px;
			height: 1px;
			background: var(--blush);
		}

		.sp-title {
			font-family: 'Cormorant', serif;
			font-size: clamp(1.5rem, 2.8vw, 2.2rem);
			font-weight: 700;
			line-height: 1.0;
			letter-spacing: -.02em;
			color: var(--ink);
		}

		.sp-title em {
			font-style: italic;
			font-weight: 300;
			color: var(--blush);
		}

		.sp-desc {
			font-size: .73rem;
			line-height: 1.82;
			color: var(--ink2);
			flex: 1;
		}

		.sp-tags {
			display: flex;
			flex-wrap: wrap;
			gap: .22rem;
		}

		.sp-tag {
			font-family: 'Space Mono', monospace;
			font-size: .38rem;
			letter-spacing: .1em;
			text-transform: uppercase;
			color: var(--muted);
			border: 1px solid var(--border);
			padding: .12rem .44rem;
		}

		.sp-tag.hi {
			color: var(--blush);
			border-color: rgba(232, 168, 176, .38);
		}

		.sp-ctas {
			display: flex;
			flex-direction: column;
			gap: .4rem;
			margin-top: .2rem;
		}

		.sp-btn-primary {
			font-family: 'Space Mono', monospace;
			font-size: .42rem;
			letter-spacing: .14em;
			text-transform: uppercase;
			color: var(--ink);
			text-decoration: none;
			border: 1px solid rgba(200, 176, 168, .42);
			padding: .55rem .9rem;
			display: inline-flex;
			align-items: center;
			justify-content: space-between;
			position: relative;
			overflow: hidden;
			cursor: pointer;
			background: none;
			transition: color .28s, border-color .28s;
		}

		.sp-btn-primary::before {
			content: '';
			position: absolute;
			inset: 0;
			background: var(--ink);
			transform: translateX(-101%);
			transition: transform .32s cubic-bezier(.76, 0, .24, 1);
			z-index: 0;
		}

		.sp-btn-primary span,
		.sp-btn-primary svg {
			position: relative;
			z-index: 1;
		}

		.sp-btn-primary:hover {
			color: #fff;
			border-color: var(--ink);
		}

		.sp-btn-primary:hover::before {
			transform: translateX(0);
		}

		.sp-btn-primary svg {
			width: 9px;
			height: 9px;
			stroke: currentColor;
			fill: none;
			stroke-width: 2;
		}

		.sp-btn-ghost {
			font-family: 'Space Mono', monospace;
			font-size: .42rem;
			letter-spacing: .14em;
			text-transform: uppercase;
			color: var(--muted);
			text-decoration: none;
			display: flex;
			align-items: center;
			gap: .35rem;
			transition: color .2s, gap .2s;
		}

		.sp-btn-ghost:hover {
			color: var(--ink);
			gap: .55rem;
		}

		.sp-btn-ghost svg {
			width: 9px;
			height: 9px;
			stroke: currentColor;
			fill: none;
			stroke-width: 2;
		}

		/* WIP notice */
		.sp-wip {
			padding: .8rem;
			border: 1px dashed rgba(200, 176, 168, .35);
			background: rgba(200, 176, 168, .05);
			margin-top: auto;
		}

		.sp-wip-text {
			font-size: .65rem;
			line-height: 1.72;
			color: var(--muted);
		}

		.sp-wip-text strong {
			color: var(--ink2);
			font-weight: 500;
		}

		/* Empty state */
		.sp-empty {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: .7rem;
			opacity: .3;
		}

		.sp-empty-glyph {
			font-size: 1.6rem;
		}

		.sp-empty-text {
			font-family: 'Space Mono', monospace;
			font-size: .42rem;
			letter-spacing: .18em;
			text-transform: uppercase;
			color: var(--muted);
			text-align: center;
			line-height: 1.9;
		}

		/* Scroll progress bar — bottom of sidebar */
		.scroll-track {
			height: 2px;
			background: var(--border);
			flex-shrink: 0;
		}

		.scroll-fill {
			height: 100%;
			background: var(--blush);
			width: 0%;
			transition: width .1s linear;
		}

		/* ════════════════════════════════════════
   RIGHT PANEL — the scrollable editorial canvas
   ════════════════════════════════════════ */
		.proj-scroll {
			overflow-y: scroll;
			overflow-x: hidden;
			scroll-snap-type: y proximity;
			background: var(--stage);
			position: relative;

			/* Guillaume's breathing room */
			padding: 12vh 10vw 20vh;
		}

		/* Subtle right-panel grain */
		.proj-scroll::before {
			content: '';
			position: sticky;
			top: 0;
			left: 0;
			display: block;
			width: 100%;
			height: 0;
			pointer-events: none;
		}

		/* Large category watermark in right panel */
		.cat-watermark {
			position: fixed;
			top: calc(var(--nav-h) + 2rem);
			right: 3rem;
			font-family: 'Cormorant', serif;
			font-size: clamp(5rem, 12vw, 11rem);
			font-weight: 700;
			line-height: 1;
			letter-spacing: -.06em;
			color: rgba(200, 176, 168, .06);
			pointer-events: none;
			user-select: none;
			z-index: 1;
			transition: opacity .5s;
		}

		/* ── PROJECT CARD ── */
		.pcard {
			width: 70%;
			margin-bottom: 22vh;
			scroll-snap-align: center;
			position: relative;
			cursor: pointer;
			/* Entrance animation on load */
			opacity: 0;
			transform: translateY(32px);
			transition: opacity .7s cubic-bezier(.22, 1, .36, 1), transform .7s cubic-bezier(.22, 1, .36, 1);
		}

		.pcard.revealed {
			opacity: 1;
			transform: translateY(0);
		}

		/* Alternating alignment — the editorial offset */
		.pcard:nth-child(odd) {
			margin-right: auto;
		}

		.pcard:nth-child(even) {
			margin-left: auto;
		}

		/* Project number — subtle corner label */
		.pcard-num {
			position: absolute;
			top: -.05em;
			left: 0;
			font-family: 'Cormorant', serif;
			font-size: .85rem;
			font-weight: 700;
			color: rgba(200, 176, 168, .35);
			line-height: 1;
			transform: translateY(-100%) translateY(-.4rem);
			pointer-events: none;
		}

		/* Media container */
		.pcard-media {
			width: 100%;
			position: relative;
			overflow: hidden;
			box-shadow: 0 40px 80px rgba(42, 31, 26, .11), 0 14px 30px rgba(42, 31, 26, .07);
			transition: box-shadow .4s;
		}

		.pcard:hover .pcard-media {
			box-shadow: 0 50px 100px rgba(42, 31, 26, .16), 0 20px 40px rgba(42, 31, 26, .10);
		}

		.pcard-media img {
			display: block;
			width: 100%;
			height: auto;
			object-fit: cover;
		}

		.pcard-media video {
			display: block;
			width: 100%;
			height: auto;
			object-fit: cover;
			max-height: 70vh;
		}

		/* Placeholder card (for color / spline / wip types) */
		.pcard-ph {
			width: 100%;
			aspect-ratio: 16/9;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: .8rem;
		}

		.pcard-ph-icon {
			font-size: 2rem;
			opacity: .4;
		}

		.pcard-ph-type {
			font-family: 'Space Mono', monospace;
			font-size: .5rem;
			letter-spacing: .2em;
			text-transform: uppercase;
			opacity: .45;
		}

		.pcard-ph-action {
			font-family: 'Space Mono', monospace;
			font-size: .46rem;
			letter-spacing: .16em;
			text-transform: uppercase;
			color: inherit;
			border: 1px solid currentColor;
			padding: .45rem 1rem;
			opacity: .5;
			text-decoration: none;
			display: flex;
			align-items: center;
			gap: .4rem;
			margin-top: .5rem;
			transition: opacity .2s;
		}

		.pcard-ph-action:hover {
			opacity: .85;
		}

		.pcard-ph-action svg {
			width: 9px;
			height: 9px;
			stroke: currentColor;
			fill: none;
			stroke-width: 2;
		}

		/* WIP card */
		.pcard-wip .pcard-media {
			aspect-ratio: 16/9;
			border: 1.5px dashed rgba(200, 176, 168, .35);
			background: rgba(200, 176, 168, .04);
			box-shadow: none;
		}

		.pcard-wip:hover .pcard-media {
			box-shadow: none;
		}

		/* ════════════════════════════════════════
   RESPONSIVE
   ════════════════════════════════════════ */
		@media (max-width: 900px) {
			.projects-wrap {
				grid-template-columns: 260px 1fr;
			}

			.proj-scroll {
				padding: 10vh 6vw 18vh;
			}

			.pcard {
				width: 80%;
			}
		}

		@media (max-width: 640px) {
			body {
				overflow: auto;
			}

			.projects-wrap {
				grid-template-columns: 1fr;
				height: auto;
			}

			.lab-sidebar {
				max-height: 55vh;
			}

			.proj-scroll {
				padding: 6vh 5vw 14vh;
			}

			.pcard {
				width: 100%;
			}

			.cat-watermark {
				display: none;
			}
		}

		@media (hover: none), (pointer: coarse) {
			body { cursor: auto; }
			#cur, .sphere { display: none; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
			}
			#cur, .sphere { display: none; }
		}

	</style>
</head>

<body>

	<div id="cur"></div>
	<div class="sphere" id="sphere"></div>

	<!-- ══ TOP NAV ══ -->
	<header class="top-nav">
		<a href="index.html" class="nav-logo">Jiarui <em>Yao</em></a>
		<a href="index.html" class="nav-home">
			<svg viewBox="0 0 24 24">
				<line x1="19" y1="12" x2="5" y2="12" />
				<polyline points="12 19 5 12 12 5" />
			</svg>
			Home
		</a>
	</header>
	<h1 class="sr-only">Selected Projects</h1>

	<!-- ══ CATEGORY WATERMARK (fixed in right panel) ══ -->
	<div class="cat-watermark" id="cat-watermark">01</div>

	<!-- ══ MAIN SHELL ══ -->
	<div class="projects-wrap">

		<!-- ── LEFT SIDEBAR ── -->
		<aside class="lab-sidebar">

			<!-- Category tabs -->
			<div class="cat-strip">
				<button class="ctab s1 active" data-cat="spatial">
					<span class="cdot"></span>Spatial
				</button>
				<button class="ctab s2" data-cat="systems">

		/* ════════════════════════════════════════
		   BUILD CARD MEDIA
		   ════════════════════════════════════════ */
		function buildCardMedia(proj) {
			const m = proj.media;
			const wrap = document.createElement('div');
			wrap.className = 'pcard-media';

			if (m.type === 'image') {
				const img = document.createElement('img');
				img.src = m.src;
				img.alt = proj.title;
				img.loading = 'lazy';
				if (m.ratio) img.style.aspectRatio = m.ratio;
				wrap.appendChild(img);

			} else if (m.type === 'video') {
				const vid = document.createElement('video');
				vid.muted = true;
				vid.loop = true;
				vid.playsInline = true;
				vid.setAttribute('data-autoplay', '1');
				const src = document.createElement('source');
				src.src = m.src;
				src.type = m.src.endsWith('.mov') ? 'video/quicktime' : 'video/mp4';
				vid.appendChild(src);
				wrap.appendChild(vid);

			} else if (m.type === 'color') {
				const ph = document.createElement('div');
				ph.className = 'pcard-ph';
				ph.style.background = m.bg;
				ph.style.color = m.color || '#fff';
				ph.innerHTML = `
      <div class="pcard-ph-icon">${m.icon || '◈'}</div>
      <div class="pcard-ph-type" style="color:${m.color || 'rgba(255,255,255,.5)'};">${m.typeLabel || ''}</div>
    `;
				if (proj.extLink) {
					ph.innerHTML += `<a href="${proj.extLink}" target="_blank" rel="noopener noreferrer" class="pcard-ph-action" style="color:${m.color || 'rgba(255,255,255,.6)'};">
        Open Live
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>`;
				}
				wrap.appendChild(ph);

			} else if (m.type === 'wip') {
				const ph = document.createElement('div');
				ph.className = 'pcard-ph';
				ph.innerHTML = `
      <div class="pcard-ph-icon" style="opacity:.2;">◌</div>
      <div class="pcard-ph-type">In Progress</div>
    `;
				wrap.appendChild(ph);
				wrap.parentElement && wrap.parentElement.classList.add('pcard-wip');
			}

			return wrap;
		}

		/* ════════════════════════════════════════
		   BUILD SINGLE CARD
		   ════════════════════════════════════════ */
		function buildCard(proj) {
			const card = document.createElement('article');
			card.className = 'pcard' + (proj.media.type === 'wip' ? ' pcard-wip' : '');
			card.dataset.projId = proj.id;

			// Project number
			const numEl = document.createElement('div');
			numEl.className = 'pcard-num';
			numEl.textContent = proj.num;
			card.appendChild(numEl);

			// Media
			const media = buildCardMedia(proj);
			card.appendChild(media);

			// Click: jump sidebar to this project
			card.addEventListener('click', () => updateSidebar(proj, true));

			return card;
		}

		/* ════════════════════════════════════════
		   RENDER SCROLL CANVAS
		   ════════════════════════════════════════ */
		function renderScrollCanvas(cat) {
			const scroll = document.getElementById('proj-scroll');
			scroll.innerHTML = '';

			// Kill old observers
			if (cardObserver) {
				cardObserver.disconnect();
				cardObserver = null;
			}
			if (revealObserver) {
				revealObserver.disconnect();
				revealObserver = null;
			}

			const projects = DB[cat].projects;
			projects.forEach(proj => {
				const card = buildCard(proj);
				scroll.appendChild(card);
			});

			// Reset scroll position
			scroll.scrollTop = 0;

			// Setup observers after a tick (DOM settled)
			requestAnimationFrame(() => {
				setupRevealObserver();
				setupCardObserver(cat);
				setupVideoObserver();
				setupScrollProgress(scroll);
			});
		}

		/* ════════════════════════════════════════
		   INTERSECTION OBSERVER — card reveal
		   ════════════════════════════════════════ */
		function setupRevealObserver() {
			revealObserver = new IntersectionObserver((entries) => {
				entries.forEach(e => {
					if (e.isIntersecting) {
						e.target.classList.add('revealed');
						revealObserver.unobserve(e.target);
					}
				});
			}, {
				threshold: 0.08,
				rootMargin: '0px 0px -60px 0px'
			});

			document.querySelectorAll('.pcard').forEach(c => revealObserver.observe(c));
		}

		/* ════════════════════════════════════════
		   INTERSECTION OBSERVER — card → sidebar sync
		   THE KEY INTERACTION
		   ════════════════════════════════════════ */
		function setupCardObserver(cat) {
			const projects = DB[cat].projects;
			const projMap = {};
			projects.forEach(p => projMap[p.id] = p);

			// Trigger when card is 35-65% visible (center of viewport)
			cardObserver = new IntersectionObserver((entries) => {
				// Find the most visible card
				let maxRatio = 0;
				let bestProj = null;

				entries.forEach(e => {
					if (e.isIntersecting && e.intersectionRatio > maxRatio) {
						maxRatio = e.intersectionRatio;
						const proj = projMap[e.target.dataset.projId];
						if (proj) bestProj = proj;
					}
				});

				if (bestProj && bestProj.id !== currentProjId) {
					currentProjId = bestProj.id;
					updateSidebar(bestProj, false);
				}
			}, {
				threshold: [0, 0.2, 0.4, 0.5, 0.6],
				rootMargin: '-15% 0px -15% 0px'
			});

			document.querySelectorAll('.pcard').forEach(c => cardObserver.observe(c));
		}

		/* ════════════════════════════════════════
		   VIDEO AUTOPLAY on scroll into view
		   ════════════════════════════════════════ */
		function setupVideoObserver() {
			const videoObs = new IntersectionObserver((entries) => {
				entries.forEach(e => {
					const vid = e.target.querySelector('video[data-autoplay]');
					if (!vid) return;
					if (e.isIntersecting) {
						vid.play().catch(() => {});
					} else {
						vid.pause();
					}
				});
			}, {
				threshold: 0.3
			});

			document.querySelectorAll('.pcard').forEach(c => videoObs.observe(c));
		}

		/* ════════════════════════════════════════
		   SCROLL PROGRESS BAR
		   ════════════════════════════════════════ */
		function setupScrollProgress(scrollEl) {
			const fill = document.getElementById('scroll-fill');
			scrollEl.addEventListener('scroll', () => {
				const pct = scrollEl.scrollTop / (scrollEl.scrollHeight - scrollEl.clientHeight) * 100;
				fill.style.width = Math.min(100, pct) + '%';
			}, {
				passive: true
			});
		}

		/* ════════════════════════════════════════
		   UPDATE SIDEBAR — the crossfade
		   ════════════════════════════════════════ */
		function updateSidebar(proj, scrollIntoView) {
			const panel = document.getElementById('sync-panel');

			// Fade out
			panel.classList.add('fading');

			setTimeout(() => {
				const hiSet = new Set(proj.hiTags || []);
				const tagHTML = proj.tags.map(t =>
					`<span class="sp-tag ${hiSet.has(t) ? 'hi' : ''}">${t}</span>`
				).join('');

				const titleFull = proj.titleEm ?
					`${proj.title}<br><em>${proj.titleEm}</em>` :
					proj.title;

				let ctaHTML = '';
				if (proj.caseStudy) {
					ctaHTML += `<a href="${proj.caseStudy}" class="sp-btn-primary">
        <span>Read Case Study</span>
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>`;
				}
				if (proj.extLink) {
					ctaHTML += `<a href="${proj.extLink}" target="_blank" rel="noopener noreferrer" class="sp-btn-ghost">
        Open Live
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>`;
				}

				const wipHTML = proj.media.type === 'wip' ?
					`<div class="sp-wip"><p class="sp-wip-text"><strong>In Progress</strong> — Currently being documented. Reach out for a walkthrough.</p></div>` :
					'';

				panel.innerHTML = `
      <div class="sp-num">${proj.num}</div>
      <div class="sp-label">${proj.label}</div>
      <div class="sp-title">${titleFull}</div>
      <div class="sp-desc">${proj.desc}</div>
      <div class="sp-tags">${tagHTML}</div>
      ${ctaHTML ? `<div class="sp-ctas">${ctaHTML}</div>` : ''}
      ${wipHTML}
    `;

				// Fade in
				panel.classList.remove('fading');

				// Re-bind cursor for new buttons
				panel.querySelectorAll('a, button').forEach(el => {
					el.addEventListener('mouseenter', () => cur.style.transform = 'translate(-50%,-50%) scale(2.2)');
					el.addEventListener('mouseleave', () => cur.style.transform = 'translate(-50%,-50%) scale(1)');
				});

				// Optionally scroll the card into view (when clicked)
				if (scrollIntoView) {
					const card = document.querySelector(`[data-proj-id="${proj.id}"]`);
					if (card) card.scrollIntoView({
						behavior: 'smooth',
						block: 'center'
					});
				}

			}, 280);
		}

		/* ════════════════════════════════════════
		   SWITCH CATEGORY
		   ════════════════════════════════════════ */
		function switchCat(cat) {
			currentCat = cat;
			currentProjId = null;

			// Update tabs
			document.querySelectorAll('.ctab').forEach(t =>
				t.classList.toggle('active', t.dataset.cat === cat)
			);

			const data = DB[cat];
			document.getElementById('lab-big-num').textContent = data.num;
			document.getElementById('lab-counter').textContent = `— ${data.count} projects`;
			document.getElementById('cat-watermark').textContent = data.num;

			// Reset sidebar
			const panel = document.getElementById('sync-panel');
			panel.innerHTML = `
    <div class="sp-empty">
      <div class="sp-empty-glyph">◎</div>
      <p class="sp-empty-text">Scroll to explore</p>
    </div>
  `;
			document.getElementById('scroll-fill').style.width = '0%';

			renderScrollCanvas(cat);
		}

		/* ════════════════════════════════════════
		   INIT
		   ════════════════════════════════════════ */
		document.querySelectorAll('.ctab').forEach(tab => {
			tab.addEventListener('click', () => switchCat(tab.dataset.cat));
		});

		switchCat('spatial');

		/* ════════════════════════════════════════
		   CURSOR
		   ════════════════════════════════════════ */
		const cur = document.getElementById('cur');
		document.addEventListener('mousemove', e => {
			cur.style.left = e.clientX + 'px';
			cur.style.top = e.clientY + 'px';
		});
		document.querySelectorAll('a, button, .pcard').forEach(el => {
			el.addEventListener('mouseenter', () => cur.style.transform = 'translate(-50%,-50%) scale(2.2)');
			el.addEventListener('mouseleave', () => cur.style.transform = 'translate(-50%,-50%) scale(1)');
		});

		/* ════════════════════════════════════════
		   PEARL SPHERE
		   ════════════════════════════════════════ */
		const sphere = document.getElementById('sphere');
		let mx = innerWidth / 2,
			my = innerHeight / 2,
			sx = mx,
			sy = my;
		let visible = false,
			isNear = false;

		document.addEventListener('mousemove', e => {
			mx = e.clientX;
			my = e.clientY;
			if (!visible) {
				sphere.style.opacity = '1';
				visible = true;
			}
		});
		document.addEventListener('mouseleave', () => {
			sphere.style.opacity = '0';
			visible = false;
		});

		(function loop() {
			sx += (mx - sx) * .072;
			sy += (my - sy) * .072;
			sphere.style.left = sx + 'px';
			sphere.style.top = sy + 'px';
			const dx = (mx - sx) / 15,
				dy = (my - sy) / 15;
			const sp = Math.hypot(mx - sx, my - sy),
				sh = Math.min(sp / 110, 1);
			const r = Math.round(242 - sh * 58),
				g = Math.round(200 + sh * 4),
				b = Math.round(154 + sh * 70);
			sphere.style.background = `radial-gradient(circle at ${35+dx}% ${35+dy}%,rgba(255,255,255,.95) 0%,rgba(242,235,224,.60) 22%,rgb(${r},${g},${b}) 55%,rgba(42,31,26,1) 100%)`;
			let near = false;
			document.querySelectorAll('a,button,.pcard,.sp-title').forEach(el => {
				const rc = el.getBoundingClientRect();
				if (Math.hypot(sx - (rc.left + rc.width / 2), sy - (rc.top + rc.height / 2)) < 100) near = true;
			});
			if (near !== isNear) {
				isNear = near;
				sphere.style.transform = near ? 'translate(-50%,-50%) scale(.42)' : 'translate(-50%,-50%) scale(1.2)';
				sphere.style.filter = near ? 'blur(26px)' : 'blur(4px)';
				sphere.style.opacity = near ? (visible ? '.2' : '0') : (visible ? '1' : '0');
			}
			requestAnimationFrame(loop);
		})();

		/* ════════════════════════════════════════
		   LIQUID VEIL
		   ════════════════════════════════════════ */
		(function() {
			const veil = document.createElement('div');
			Object.assign(veil.style, {
				position: 'fixed',
				inset: '0',
				zIndex: '99999',
				background: '#f2ebe0',
				transformOrigin: 'top center',
				transform: 'translateY(0)',
				transition: 'transform 0.72s cubic-bezier(0.76,0,0.24,1)',
				pointerEvents: 'none'
			});
			const sh = document.createElement('div');
			Object.assign(sh.style, {
				position: 'absolute',
				inset: '0',
				background: 'linear-gradient(135deg,rgba(242,200,154,.2) 0%,transparent 45%,rgba(184,204,224,.15) 100%)'
			});
			veil.appendChild(sh);
			document.body.prepend(veil);
			veil.getBoundingClientRect();
			requestAnimationFrame(() => requestAnimationFrame(() => {
				veil.style.transform = 'translateY(-100%)';
			}));
			let nav = false;
			document.addEventListener('click', e => {
				const a = e.target.closest('a[href]');
				if (!a || nav) return;
				const h = a.getAttribute('href');
				if (!h || h === '#' || h.startsWith('#') || h.startsWith('http') || a.target === '_blank') return;
				e.preventDefault();
				nav = true;
				veil.style.transition = 'transform 0.58s cubic-bezier(0.76,0,0.24,1)';
				veil.style.transform = 'translateY(0)';
				setTimeout(() => {
					window.location.href = h;
				}, 580);
			});
		})();

	</script>
</body>

</html>
